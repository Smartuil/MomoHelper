# PostgreSQL 16 调参（2 核 2G 规格）
# 挂载路径：server/config/postgresql.conf -> /etc/postgresql/postgresql.conf

max_connections = 50
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 8MB
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB

# SSD 相关：默认值是给机械盘调的
random_page_cost = 1.1
effective_io_concurrency = 200

# 仅监听本机，绝不暴露公网
listen_addresses = ''

# 日志
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off

# 时区与编码
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
