# Nginx 站点配置（独立服务器方案）
#
# 职责：TLS 终结、静态资源、反向代理、限流。不承载任何业务逻辑。
# 安装：/etc/nginx/conf.d/momohelper.conf
# 证书：certbot --nginx -d example.com

# 限流区：按真实客户端 IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_ai:10m rate=2r/s;

# HTTP 跳转 HTTPS
server
{
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Web 静态产物（Next.js 静态导出）
    root /var/www/momohelper;
    index index.html;

    location /
    {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location /_next/static/
    {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # AI 流式接口：独立限流 + 关闭缓冲，保证 SSE 逐块下发
    location /api/ai/
    {
        limit_req zone=api_ai burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 其余业务接口
    location /api/
    {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
